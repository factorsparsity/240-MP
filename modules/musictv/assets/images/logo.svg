<svg width="100%" height="100%" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;">
  <!-- A CRT set with a beamed quaver on screen: music, on television. Deliberately
       generic — no channel's mark. White fill to match the other module logos
       (they are tinted by the shell). -->

    <path d="M5,19.6 L8,19.6 L8,21.6 L5,21.6 Z"/>
    <path d="M16,19.6 L19,19.6 L19,21.6 L16,21.6 Z"/>
    <!-- Beamed quaver on the screen -->
    <path d="M10,8 L17,6.4 L17,8.2 L11.6,9.5 L11.6,13.6 L10,13.6 Z"/>
    <ellipse cx="9.1" cy="14" rx="2.1" ry="1.7"/>
    <ellipse cx="16.1" cy="12.4" rx="2.1" ry="1.7"/>
    <path d="M15.4,8.6 L17,8.2 L17,12.8 L15.4,12.8 Z"/>
  </g>
</svg>
